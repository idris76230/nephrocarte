name: Mise à jour et publication

on:
  schedule:
    - cron: "0 4 * * 1"     # chaque lundi à 4 h UTC
  workflow_dispatch:         # bouton « Run workflow » pour une mise à jour à la demande
  push:
    branches: [main]
    paths: ["app/template.html", "scripts/**", "data/local/**", "data/phrc_lists/**", "data/phrc_alias.json", "data/corrections.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # données brutes conservées d'une exécution à l'autre (fiches CTIS déjà téléchargées, dernière collecte réussie)
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Collecte et construction
        run: ./run_all.sh

      - name: Enregistrer les données mises à jour
        run: |
          git config user.name "nephrocarte-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/data.json data/phrc_rapport.csv data/local data/corrections_formulaire.json site/index.html
          git diff --cached --quiet || git commit -m "Mise à jour automatique des données ($(date -u +%Y-%m-%d))"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
